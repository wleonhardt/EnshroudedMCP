[package]
name = "sdk128-prop-placement-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]

[lib]
path = "src/runtime.rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.enshwick]
id = "enshrouded.placement-qualification"
name = "Placement metadata qualification"
side = "server"

[dependencies]
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "9f6efc821524df426991fb584a761eaa0e5ea898", features = ["unstable"] }
serde_json = "1"

[dev-dependencies]
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "9f6efc821524df426991fb584a761eaa0e5ea898", features = ["unstable", "test"] }
