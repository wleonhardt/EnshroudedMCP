[package]
name = "sdk-lifecycle-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]

[lib]
path = "src/runtime.rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.enshwick]
id = "enshrouded.lifecycle-qualification"
name = "Lifecycle provider qualification"
side = "both"

[dependencies]
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "6a5966ee6683fde480ac9dd3654f91e73da6e2a5", features = ["unstable"] }
serde_json = "=1.0.154"

[dev-dependencies]
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "6a5966ee6683fde480ac9dd3654f91e73da6e2a5", features = ["unstable", "test"] }
