[workspace]
resolver = "3"
members = ["crates/policy", "crates/mcp", "crates/transport", "crates/client"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Pin the exact official development build whose loader is staged for validation.
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "acd5550c607a38c983433f9807cc95564244fe0b" }
policy = { path = "crates/policy" }
mcp-transport = { path = "crates/transport" }
serde_json = "1"

# SDK-only existing-field exposure; native ABI is official 11.30. See decision 0010.
[patch."https://github.com/enshwick/enshwick"]
enshwick = { path = "../enshwick-native-control/crates/enshwick" }

# The loader catches a panic in a mod and turns only that mod off; it needs unwinding.
[profile.release]
panic = "unwind"
