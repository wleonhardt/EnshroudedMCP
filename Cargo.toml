[workspace]
resolver = "3"
members = ["crates/policy", "crates/mcp", "crates/transport", "crates/client"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Alphas are not on crates.io; pin the tag whose loader supports the game build in use.
enshwick = { git = "https://github.com/enshwick/enshwick", tag = "v1.0.0-alpha.14" }
policy = { path = "crates/policy" }
mcp-transport = { path = "crates/transport" }
serde_json = "1"

# Local alpha.14 compatibility extension; see decision 0003 and its patch artifact.
[patch."https://github.com/enshwick/enshwick"]
enshwick = { path = "../enshwick/crates/enshwick" }

# The loader catches a panic in a mod and turns only that mod off; it needs unwinding.
[profile.release]
panic = "unwind"
