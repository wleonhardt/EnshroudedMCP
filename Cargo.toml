[workspace]
resolver = "3"
members = ["crates/policy", "crates/mcp", "crates/transport", "crates/client"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# Pin the exact official alpha.17 release qualified with its matching signed loader.
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "6a151a9550ed7a6ade99c23fa817a91e25b71bc9" }
policy = { path = "crates/policy" }
mcp-transport = { path = "crates/transport" }
serde_json = "1"

# The loader catches a panic in a mod and turns only that mod off; it needs unwinding.
[profile.release]
panic = "unwind"
